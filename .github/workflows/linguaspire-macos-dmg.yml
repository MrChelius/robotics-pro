name: Build LinguaSpire macOS DMG

on:
  push:
    branches:
      - linguaspire-dmg-build
    paths:
      - "linguaspire-desktop/**"
      - ".github/workflows/linguaspire-macos-dmg.yml"
  pull_request:
    branches:
      - main
    paths:
      - "linguaspire-desktop/**"
      - ".github/workflows/linguaspire-macos-dmg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate native app icon
        working-directory: linguaspire-desktop
        run: |
          python3 scripts/make_icon.py
          rm -rf assets/icon.iconset
          mkdir -p assets/icon.iconset
          sips -z 16 16 assets/icon-1024.png --out assets/icon.iconset/icon_16x16.png
          sips -z 32 32 assets/icon-1024.png --out assets/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon-1024.png --out assets/icon.iconset/icon_32x32.png
          sips -z 64 64 assets/icon-1024.png --out assets/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon-1024.png --out assets/icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon-1024.png --out assets/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon-1024.png --out assets/icon.iconset/icon_256x256.png
          sips -z 512 512 assets/icon-1024.png --out assets/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icon-1024.png --out assets/icon.iconset/icon_512x512.png
          cp assets/icon-1024.png assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/icon.iconset -o assets/icon.icns
          file assets/icon.icns

      - name: Install desktop dependencies
        working-directory: linguaspire-desktop
        run: npm install

      - name: Build standalone Electron app
        working-directory: linguaspire-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:arm64

      - name: Verify application bundle
        working-directory: linguaspire-desktop
        run: |
          APP="dist/mac-arm64/LinguaSpire.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/LinguaSpire"
          /usr/bin/file "$APP/Contents/MacOS/LinguaSpire"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist"

      - name: Ad-hoc sign application
        working-directory: linguaspire-desktop
        run: |
          APP="dist/mac-arm64/LinguaSpire.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create real DMG with Applications shortcut
        working-directory: linguaspire-desktop
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          ditto "dist/mac-arm64/LinguaSpire.app" "dmg-root/LinguaSpire.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create             -volname "LinguaSpire 2.8"             -srcfolder "dmg-root"             -ov             -format UDZO             "dist/LinguaSpire-2.8-macOS-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent             "dist/mac-arm64/LinguaSpire.app"             "dist/LinguaSpire-2.8-macOS-arm64.app.zip"

      - name: Verify installer artifacts
        working-directory: linguaspire-desktop
        run: |
          test -s dist/LinguaSpire-2.8-macOS-arm64.dmg
          test -s dist/LinguaSpire-2.8-macOS-arm64.app.zip
          hdiutil imageinfo dist/LinguaSpire-2.8-macOS-arm64.dmg >/dev/null
          ls -lh dist/LinguaSpire-2.8-macOS-arm64.dmg dist/LinguaSpire-2.8-macOS-arm64.app.zip
          shasum -a 256 dist/LinguaSpire-2.8-macOS-arm64.dmg dist/LinguaSpire-2.8-macOS-arm64.app.zip

      - name: Upload DMG and app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LinguaSpire-2.8-macOS-arm64
          path: |
            linguaspire-desktop/dist/LinguaSpire-2.8-macOS-arm64.dmg
            linguaspire-desktop/dist/LinguaSpire-2.8-macOS-arm64.app.zip
          if-no-files-found: error
          retention-days: 30
