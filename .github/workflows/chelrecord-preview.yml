name: ChelRecord cross-platform preview
on:
  workflow_dispatch:
  push:
    branches:
      - feature/chelrecord-crossplatform-preview
    paths:
      - 'chelrecord-crossplatform/**'
      - '.github/workflows/chelrecord-preview.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-2025
            target: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: chelrecord-crossplatform
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Test H.264/AAC MP4 encoder and decoder
        run: npm run test:media
      - name: Test UI camera and region recording flows
        run: npm run test:ui
      - name: Test system picker and legacy source enumeration
        run: npm run test:picker
      - name: Build macOS installer
        if: matrix.target == 'mac'
        run: npm run dist:mac
      - name: Verify macOS app signature
        if: matrix.target == 'mac'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/ChelRecord.app
          codesign -d --entitlements :- dist/mac-arm64/ChelRecord.app
      - name: Build Windows installer
        if: matrix.target == 'win'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ChelRecord-1.9.1-rc2-${{ matrix.target }}
          path: chelrecord-crossplatform/dist/*
          retention-days: 30
          if-no-files-found: error
