<!doctype html>
<html lang="ru">
<head>
  <base href="../../" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DJI — CCCTrade</title>
  <meta name="description" content="Detailed DJI drone specifications, gallery and indicative Russian-market pricing from CCCTrade." />
  <meta name="theme-color" content="#f5f5f7" />
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="CCCTrade" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./dji-page.css?v=20260916d" />
  <style>
    .dji-gallery-stage{position:relative;isolation:isolate;touch-action:pan-y;user-select:none}
    .dji-gallery-stage #djiMainPhoto{transition:transform .28s ease,opacity .22s ease}
    .dji-inline-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:48px;height:48px;border:0;border-radius:50%;background:rgba(17,17,17,.82);color:#fff;font-size:34px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(8px)}
    .dji-inline-arrow:hover{background:#111}.dji-inline-prev{left:18px}.dji-inline-next{right:18px}
    .dji-inline-counter{position:absolute;right:20px;bottom:18px;z-index:20;background:rgba(17,17,17,.78);color:#fff;border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;letter-spacing:.04em}
    .dji-inline-fallback{width:100%;height:100%;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:linear-gradient(145deg,#fff,#eceef2);color:#111;padding:30px;text-align:center}
    .dji-inline-fallback strong{font-size:clamp(1.8rem,4vw,3.6rem);letter-spacing:-.04em}.dji-inline-fallback span{color:#777}
    @media(max-width:560px){.dji-inline-arrow{width:42px;height:42px;font-size:30px}.dji-inline-prev{left:10px}.dji-inline-next{right:10px}.dji-inline-counter{right:12px;bottom:12px}}
  </style>
  <script src="./dji-products.js?v=20260916d" defer></script>
  <script src="./dji-page.js?v=20260916d" defer></script>
  <script src="./dji-route-fix.js?v=20260916d" defer></script>
</head>
<body class="dji-shell">
  <div id="app"><main class="dji-empty"><h1>CCCTrade · DJI</h1><p>Loading product…</p></main></div>
  <noscript><p style="padding:8vw">Enable JavaScript to view the product gallery and specifications.</p></noscript>
  <script>
    (() => {
      const productId = new URLSearchParams(location.search).get('product');
      let attempts = 0;

      function init() {
        const products = window.DJI_CATALOG?.products || [];
        const product = products.find(p => p.id === productId);
        const stage = document.querySelector('.dji-gallery-stage');
        const main = document.querySelector('#djiMainPhoto');
        if (!product || !stage || !main) {
          if (attempts++ < 80) setTimeout(init, 100);
          return;
        }
        if (stage.dataset.inlineSlider === '1') return;
        stage.dataset.inlineSlider = '1';
        stage.tabIndex = 0;

        let index = 0;
        const failed = new Set();
        const thumbs = [...document.querySelectorAll('.dji-thumb')];

        const prev = document.createElement('button');
        prev.type = 'button';
        prev.className = 'dji-inline-arrow dji-inline-prev';
        prev.setAttribute('aria-label', 'Previous photo');
        prev.textContent = '‹';

        const next = document.createElement('button');
        next.type = 'button';
        next.className = 'dji-inline-arrow dji-inline-next';
        next.setAttribute('aria-label', 'Next photo');
        next.textContent = '›';

        const counter = document.createElement('span');
        counter.className = 'dji-inline-counter';

        const fallback = document.createElement('div');
        fallback.className = 'dji-inline-fallback';
        fallback.innerHTML = `<strong>${product.name}</strong><span>Photo temporarily unavailable</span>`;

        stage.append(fallback, prev, next, counter);

        function nextGood(start, direction) {
          const total = product.images.length;
          for (let step = 0; step < total; step++) {
            const candidate = (start + direction * step + total) % total;
            if (!failed.has(candidate)) return candidate;
          }
          return -1;
        }

        function show(target, direction = 1) {
          const total = product.images.length;
          if (!total) return;
          const normalized = (target + total) % total;
          index = nextGood(normalized, direction) >= 0 ? nextGood(normalized, direction) : normalized;
          fallback.style.display = 'none';
          main.style.display = '';
          main.style.opacity = '0';
          main.style.transform = `translateX(${direction > 0 ? 18 : -18}px)`;
          requestAnimationFrame(() => {
            main.src = product.images[index];
            main.removeAttribute('srcset');
            requestAnimationFrame(() => {
              main.style.opacity = '1';
              main.style.transform = 'translateX(0)';
            });
          });
          thumbs.forEach((thumb, i) => thumb.classList.toggle('active', i === index));
          counter.textContent = `${index + 1} / ${total}`;
        }

        main.addEventListener('error', () => {
          failed.add(index);
          if (thumbs[index]) thumbs[index].style.display = 'none';
          const candidate = nextGood(index + 1, 1);
          if (candidate >= 0 && candidate !== index) show(candidate, 1);
          else {
            main.style.display = 'none';
            fallback.style.display = 'flex';
            counter.textContent = `0 / ${product.images.length}`;
          }
        });

        thumbs.forEach((thumb, i) => {
          const img = thumb.querySelector('img');
          if (img) img.addEventListener('error', () => { failed.add(i); thumb.style.display = 'none'; });
          thumb.addEventListener('click', e => { e.preventDefault(); show(i, i >= index ? 1 : -1); });
        });

        prev.addEventListener('click', e => { e.preventDefault(); show(index - 1, -1); });
        next.addEventListener('click', e => { e.preventDefault(); show(index + 1, 1); });
        stage.addEventListener('keydown', e => {
          if (e.key === 'ArrowLeft') { e.preventDefault(); show(index - 1, -1); }
          if (e.key === 'ArrowRight') { e.preventDefault(); show(index + 1, 1); }
        });

        let startX = null;
        stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button === 0) startX = e.clientX; });
        stage.addEventListener('pointerup', e => {
          if (startX == null) return;
          const dx = e.clientX - startX;
          startX = null;
          if (Math.abs(dx) < 45) return;
          show(index + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
        });

        show(0, 1);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
      window.addEventListener('load', init);
    })();
  </script>
</body>
</html>
