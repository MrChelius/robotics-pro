  <main class="simple-page">
    <span class="eyebrow">CCCTrade / PARTNERS</span>
    <h1 data-i18n="partners">Partners</h1>
    <p data-i18n="partnerText">This section is reserved for CCCTrade partners and future collaborations.</p>
    <section class="empty-partners" aria-label="Partners list"></section>
    <a class="back" href="./index.html" data-i18n="back">← Back to CCCTrade</a>
  </main>
  <script>
    (() => {
      const supported = ["ru","en","zh","it","fr","de","ja","ko"];
      const copy = {
        ru:{technology:"Технологии",compare:"Сравнение",about:"О нас",partners:"Партнёры",news:"Новости технологий и IT",partnerText:"Этот раздел предназначен для партнёров CCCTrade и будущих сотрудничеств.",back:"← Назад в CCCTrade"},
        en:{technology:"Technology",compare:"Compare",about:"About",partners:"Partners",news:"Tech & IT News",partnerText:"This section is reserved for CCCTrade partners and future collaborations.",back:"← Back to CCCTrade"},
        zh:{technology:"技术",compare:"对比",about:"关于我们",partners:"合作伙伴",news:"科技与 IT 新闻",partnerText:"此页面用于展示 CCCTrade 合作伙伴及未来合作项目。",back:"← 返回 CCCTrade"},
        it:{technology:"Tecnologia",compare:"Confronta",about:"Chi siamo",partners:"Partner",news:"Notizie Tech & IT",partnerText:"Questa sezione è riservata ai partner CCCTrade e alle future collaborazioni.",back:"← Torna a CCCTrade"},
        fr:{technology:"Technologies",compare:"Comparer",about:"À propos",partners:"Partenaires",news:"Actualités Tech & IT",partnerText:"Cette section est réservée aux partenaires CCCTrade et aux futures collaborations.",back:"← Retour à CCCTrade"},
        de:{technology:"Technologie",compare:"Vergleichen",about:"Über uns",partners:"Partner",news:"Tech- & IT-News",partnerText:"Dieser Bereich ist für CCCTrade-Partner und zukünftige Kooperationen vorgesehen.",back:"← Zurück zu CCCTrade"},
        ja:{technology:"テクノロジー",compare:"比較",about:"会社情報",partners:"パートナー",news:"テック＆ITニュース",partnerText:"このセクションはCCCTradeのパートナーおよび今後の協業のためのページです。",back:"← CCCTradeに戻る"},
        ko:{technology:"기술",compare:"비교",about:"회사 소개",partners:"파트너",news:"테크 & IT 뉴스",partnerText:"이 섹션은 CCCTrade 파트너 및 향후 협업을 위한 공간입니다.",back:"← CCCTrade로 돌아가기"}
      };
      const params = new URLSearchParams(location.search);
      let stored = "";
      try { stored = JSON.parse(localStorage.getItem("robotics_pro_language") || '""'); } catch {}
      let lang = params.get("lang") || stored || "en";
      if (!supported.includes(lang)) lang = "en";
      document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
      document.querySelector("#pageLanguage").value = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => { const value = copy[lang][el.dataset.i18n]; if (value) el.textContent = value; });
      document.querySelectorAll('a[href]').forEach(a => {
        const raw = a.getAttribute('href');
        if (!raw || raw.startsWith('http') || raw.startsWith('mailto:') || raw.startsWith('tel:') || raw.startsWith('#')) return;
        const url = new URL(raw, location.href);
        url.searchParams.set('lang', lang);
        a.href = url.pathname + url.search + url.hash;
      });
      document.querySelector("#pageLanguage").addEventListener("change", e => {
        const next = e.target.value;
        localStorage.setItem("robotics_pro_language", JSON.stringify(next));
        const url = new URL(location.href);
        url.searchParams.set("lang", next);
        location.href = url.toString();
      });
    })();
  </script>
