<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Select recording area</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,sans-serif;cursor:crosshair}
#shade{position:fixed;inset:0;background:rgba(7,13,28,.38)}
#top{position:fixed;z-index:4;top:28px;left:50%;transform:translateX(-50%);border:1px solid #ffffff30;border-radius:16px;padding:14px 22px;min-width:310px;text-align:center;background:#121a2eee;box-shadow:0 16px 60px #0008;backdrop-filter:blur(22px);pointer-events:none}
.title{font-size:15px;letter-spacing:.1px;font-weight:850}
.subtitle{font-size:12px;color:#bbcade;margin-top:4px}
#selection{position:absolute;z-index:2;display:none;border:2px solid #55e2ff;background:#55e2ff15;box-shadow:0 0 0 200vmax rgba(3,7,18,.15), 0 0 0 1px #001f55 inset;border-radius:4px;pointer-events:none}
#dims{position:absolute;top:-36px;left:0;background:#0c1731f5;border:1px solid #59cfff77;border-radius:8px;padding:6px 10px;font-weight:800;white-space:nowrap;font-size:12px;display:none}
#crosshair{pointer-events:none;z-index:3;position:fixed;width:1px;height:1px;background:#bffaff;box-shadow:0 0 12px 3px #62daff88;left:-20px;top:-20px}
#footer{position:fixed;z-index:4;bottom:25px;left:50%;transform:translateX(-50%);color:#d8e8f4;background:#111b31ef;border:1px solid #ffffff24;border-radius:30px;padding:10px 17px;font-weight:650;font-size:12px;white-space:nowrap;pointer-events:none}
kbd{font:inherit;color:#aef4ff;background:#203955;padding:3px 6px;border-radius:5px;margin:0 2px}
</style></head>
<body>
<div id="shade"></div>
<div id="top"><div class="title">Select the recording area</div><div class="subtitle">Click and drag anywhere on your desktop to select the region</div></div>
<div id="selection"><div id="dims"></div></div>
<div id="crosshair"></div>
<div id="footer">Release to confirm · <kbd>Esc</kbd> Cancel · Minimum 40 × 40 px</div>
<script>
'use strict';
let anchor=null,finished=false;
const sel=document.getElementById('selection'),dims=document.getElementById('dims');
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const normalized=(event)=>({x:clamp(event.clientX,0,innerWidth),y:clamp(event.clientY,0,innerHeight)});
addEventListener('pointerdown',(event)=>{
 if(finished||event.button!==0)return;
 anchor=normalized(event);event.preventDefault();
 sel.style.display='block';document.body.setPointerCapture(event.pointerId);
});
addEventListener('pointermove',(event)=>{
 const p=normalized(event);const crosshair=document.getElementById('crosshair');
 crosshair.style.left=p.x+'px';crosshair.style.top=p.y+'px';
 if(!anchor||finished)return;
 const x=Math.min(p.x,anchor.x),y=Math.min(p.y,anchor.y),w=Math.abs(p.x-anchor.x),h=Math.abs(p.y-anchor.y);
 Object.assign(sel.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 dims.style.display='block';dims.textContent=Math.round(w)+' × '+Math.round(h)+' px';
});
addEventListener('pointerup',(event)=>{
 if(!anchor||finished)return;const p=normalized(event);
 const x=Math.min(p.x,anchor.x),y=Math.min(p.y,anchor.y),w=Math.abs(p.x-anchor.x),h=Math.abs(p.y-anchor.y);
 anchor=null;
 if(w<40||h<40){sel.style.display='none';return}
 finished=true;
 window.chelrecord.finishRegion({
  x:clamp(x/innerWidth,0,1),y:clamp(y/innerHeight,0,1),
  w:clamp(w/innerWidth,0,1),h:clamp(h/innerHeight,0,1)
 });
});
addEventListener('keydown',(event)=>{if(event.key==='Escape'&&!finished){finished=true;window.chelrecord.cancelRegion()}});
</script></body></html>
